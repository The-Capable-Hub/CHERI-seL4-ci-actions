# sel4test simulation runs
#
# See sel4test-sim/builds.yml in the repo seL4/ci-actions for configs.

name: seL4Test-Sim

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      container-image:
        type: string
        required: false
        default: ""

jobs:
  sim:
    name: Simulation
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image != '' && inputs.container-image || null }}
    strategy:
      matrix:
        march: [armv7a, armv8a, nehalem, rv32imac, rv64imac]
        compiler: [gcc, clang]
        #include:
        #  - march: rv64imac_zcherihybrid
        #    compiler: llvm
    concurrency:
      group: ${{ github.workflow }}-sel4sim-pr-${{ github.event.number }}-${{ strategy.job-index }}
      cancel-in-progress: true
    steps:
    - shell: bash
      run: |
        pip3 install protobuf --upgrade --user
        pip3 install grpcio-tools --upgrade --user

    - uses: The-Capable-Hub/CHERI-seL4-ci-actions/sel4test-sim@michaelcobb/capable-hub-ci
      with:
        march: ${{ matrix.march }}
        compiler: ${{ matrix.compiler }}
