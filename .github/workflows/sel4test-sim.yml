# sel4test simulation runs
#
# See sel4test-sim/builds.yml in the repo seL4/ci-actions for configs.

name: seL4Test-Sim

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest

jobs:
  sim:
    name: Simulation
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ matrix.docker_image || 'sel4/sel4test-sim:latest' }}
    strategy:
      fail-fast: false
      matrix:
        march: [armv7a, armv8a, nehalem, rv32imac, rv64imac]
        compiler: [gcc, clang]
        #include:
        #  - march: rv64imac_zcherihybrid
        #    compiler: clang
        #    docker_image: "capablehub/cheri-sel4-ci-riscv-sel4test-sim:latest"
    concurrency:
      group: ${{ github.workflow }}-sel4sim-pr-${{ github.event.number }}-${{ strategy.job-index }}
      cancel-in-progress: true
    steps:
    - uses: The-Capable-Hub/CHERI-seL4-ci-actions/sel4test-sim@michaelcobb/capable-hub-ci
      with:
        march: ${{ matrix.march }}
        compiler: ${{ matrix.compiler }}
        docker_image: ${{ matrix.docker_image || 'sel4/sel4test-sim:latest' }}
