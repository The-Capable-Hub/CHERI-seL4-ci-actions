# Build and push camkes-unit docker image on changes to relevant files

name: Deploy CAmkES Unit

on:
  push:
    branches:
    - master
    paths:
    - 'scripts/**'
    - 'camkes-unit/**'
  workflow_dispatch:
  # allow explict trigger from other repos when dependencies have changed
  repository_dispatch:
    types: [deps-update]
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      container-image:
        type: string
        required: false
        default: ""

jobs:
  docker:
    name: Docker (CAmkES Unit)
    if: ${{ github.repository_owner == 'seL4' }}
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image != '' && inputs.container-image || null }}
    steps:
    - uses: docker/setup-buildx-action@v2
    - uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - uses: docker/build-push-action@v3
      with:
        push: true
        file: camkes-unit/Dockerfile
        tags: sel4/camkes-unit:latest
