# Build and push cparser-run docker image on changes to relevant files

name: Deploy CParser Run

on:
  # the real build trigger is in deploy-cparser-builder
  repository_dispatch:
    types: [cparser-build, deps-update]
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      container-image:
        type: string
        required: false
        default: ""

jobs:
  docker:
    name: Docker (C Parser Run)
    if: ${{ github.repository_owner == 'seL4' }}
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image != '' && inputs.container-image || null }}
    steps:
    - uses: docker/setup-buildx-action@v2
    - uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - uses: docker/build-push-action@v3
      with:
        push: true
        file: cparser-run/Dockerfile
        tags: sel4/cparser-run:latest
