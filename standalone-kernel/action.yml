name: 'Compile standalone kernel'
description: |
  Attempts to compile the verified configurations of the stand-alone
  seL4 kernel.
author: Luke Mondy <luke.mondy@data61.csiro.au>

inputs:
  ARCH:
    description: 'Architecture to test. One of ARM, ARM_HYP, AARCH64, RISCV64, X64'
    required: true

  COMPILER:
    description: 'Which compiler suite to use. One of gcc, llvm'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build Docker image
      shell: bash
      run: |
        ( cd $GITHUB_ACTION_PATH/ && docker build -t compile-kernel -f Dockerfile . )
    - name: Run build
      shell: bash
      env:
        INPUT_ARCH: ${{ inputs.ARCH }}
        INPUT_COMPILER: ${{ inputs.COMPILER }}
      run: |
        docker run --rm -e INPUT_ARCH -e INPUT_COMPILER -v $GITHUB_WORKSPACE:/workspace -w /workspace compile-kernel

